pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 32m;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream booking_api {
    zone booking_api 64k;
    server backend:8080 resolve;
  }
  limit_req_zone $binary_remote_addr zone=booking_login:1m rate=5r/m;
  limit_req_status 429;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  server {
    listen 8080;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /acme; default_type text/plain; }
    location / { return 308 https://8.155.137.77$request_uri; }
  }
  server {
    listen 8443 ssl;
    server_name 8.155.137.77;
    if ($host != 8.155.137.77) { return 444; }
    ssl_certificate /tls/fullchain.pem;
    ssl_certificate_key /tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:booking_ssl:1m;
    ssl_session_timeout 10m;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    location ^~ /api/v1/internal/ { return 404; }
    location = /api/v1/auth/login {
      limit_req zone=booking_login burst=5 nodelay;
      include /etc/nginx/booking-proxy.conf;
    }
    location /api/ { include /etc/nginx/booking-proxy.conf; }
    location /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~ /\. { deny all; }
  }
}
