name: college-booking-public
services:
  entry:
    image: ${BOOKING_WEB_IMAGE:?Set BOOKING_WEB_IMAGE to the current web release image}
    container_name: college-booking-entry
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    networks: [booking]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy.conf:/etc/nginx/booking-proxy.conf:ro
      - ./acme:/acme:ro
      - ./tls:/tls:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/.well-known/acme-challenge/connectivity-check"]
      interval: 15s
      timeout: 5s
      retries: 5
networks:
  booking:
    external: true
    name: college-booking_default
