name: Build and test

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: college_booking
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: ci_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d college_booking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/college_booking
      DB_USERNAME: booking
      DB_PASSWORD: ci_local_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Backend tests
        working-directory: backend
        run: |
          if [ -f ./mvnw ]; then
            chmod +x ./mvnw
            ./mvnw -B verify
          else
            mvn -B verify
          fi
      - name: Database migration and real API smoke test
        working-directory: backend
        run: |
          ./mvnw -B spring-boot:run > backend-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:8080/api/v1/health > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          if ! curl -fsS http://localhost:8080/api/v1/health; then
            cat backend-server.log
            exit 1
          fi
          curl -fsS http://localhost:8080/api/v1/locations |
            python3 -c 'import json,sys; rows=json.load(sys.stdin); assert len(rows)==4; assert sum(x["type"]=="OFFICE" for x in rows)==3; assert sum(x["type"]=="STORAGE" for x in rows)==1'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
