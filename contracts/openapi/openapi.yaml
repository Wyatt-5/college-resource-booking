openapi: 3.0.3
info:
  title: 学院共用资源预约与借还系统 API
  version: 0.2.0
  description: '基于前端 PR #2 的接口契约。目录、物品写入、实物和展示照片已有实现；管理操作依赖认证模块提供可信服务端身份与授权范围。归还核验业务服务已有实现，但真实预约适配器尚未提供，返回 DEPENDENCY_UNAVAILABLE。auth/users
    仍是待实现契约，不代表已经上线。'
servers:
- url: http://localhost:8080/api/v1
  description: 本地开发；部署后通过环境配置替换地址
paths:
  /health:
    get:
      summary: 后端进程健康检查
      operationId: getHealth
      responses:
        '200':
          description: 服务已启动
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /locations:
    get:
      summary: 获取初始存放地点
      operationId: listLocations
      responses:
        '200':
          description: 地点列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /items:
    get:
      summary: 物品列表（管理端/浏览）
      operationId: listItems
      parameters:
      - name: locationId
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: keyword
        in: query
        description: 名称或介绍包含匹配；%和_按字面匹配
        schema:
          type: string
          maxLength: 100
          default: ''
      - name: status
        in: query
        description: 公开目录仅支持ACTIVE；INACTIVE需scope=managed并授权
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - public
          - managed
          default: public
      - name: onlyAvailable
        in: query
        description: 当前至少有一件AVAILABLE实物，不代表预约时段可用量
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 物品及服务端库存摘要
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/Item'
                - $ref: '#/components/schemas/ItemPage'
          headers:
            X-Total-Count:
              schema:
                type: integer
                format: int64
              description: 筛选后的总数量
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无管理范围权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 状态冲突或幂等键内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: '未传page和size时保留PR #2的数组格式（默认最多20条）；显式传任一分页参数时返回分页对象。X-Total-Count始终返回总数。scope=managed仅返回本人可管理地点的物品。'
    post:
      summary: 上架物品（管理员）
      operationId: createItem
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          maxLength: 200
        description: 防重复提交
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 状态冲突或幂等键内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
  /items/{itemId}:
    patch:
      summary: 编辑物品（管理员）
      operationId: updateItem
      parameters:
      - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPatch'
      responses:
        '200':
          description: 更新后的物品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无管理范围权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 状态冲突或幂等键内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: 部分更新，省略字段保持不变；rules按子字段合并。地点变更同时检查原地点和新地点授权。贵重标记不会修改既有预约快照，预约模块必须保留申请创建时的规则。
      security:
      - bearerAuth: []
    get:
      summary: 物品详情
      operationId: getItem
      parameters:
      - $ref: '#/components/parameters/ItemId'
      - name: managed
        in: query
        schema:
          type: boolean
          default: false
        description: true时校验管理范围并允许查看停用物品
      responses:
        '200':
          description: 含创建时间、库存、规则及受控图片地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: 不存在或未上架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无管理范围权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 状态冲突或幂等键内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /items/{itemId}/images:
    post:
      summary: 上传物品展示照片（管理员）
      operationId: uploadItemImage
      parameters:
      - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 限 JPG / PNG / WebP，单张不超过 5MB
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemImage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无管理范围权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 状态冲突或幂等键内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: 按真实内容解码校验JPEG/PNG/WebP，最多5MiB、20百万像素、边长10000；默认每物品最多6张，可配置。张数上限为本地采用的暂定方案，待组内确认。
      security:
      - bearerAuth: []
    get:
      summary: 读取图片元数据（需登录）
      operationId: listItemImages
      parameters:
      - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: 图片地址受权限控制
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemImage'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无管理范围权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 状态冲突或幂等键内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
  /items/{itemId}/images/{imageId}:
    delete:
      summary: 移除物品展示照片（管理员）
      operationId: deleteItemImage
      parameters:
      - $ref: '#/components/parameters/ItemId'
      - name: imageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: 已删除
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无管理范围权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 状态冲突或幂等键内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
    get:
      summary: 受控读取图片二进制
      operationId: readItemImage
      parameters:
      - $ref: '#/components/parameters/ItemId'
      - name: imageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: no-store，nosniff；不返回内部存储键
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无管理范围权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 状态冲突或幂等键内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
  /items/{itemId}/units:
    get:
      summary: 查看物品的具体实物
      operationId: listItemUnits
      parameters:
      - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: 实物列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemUnit'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无管理范围权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 状态冲突或幂等键内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
    post:
      summary: 增加实物编号（管理员）
      operationId: createItemUnit
      parameters:
      - $ref: '#/components/parameters/ItemId'
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          maxLength: 200
        description: 可选；不提供时仍由物品内编号唯一约束防重复
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - unitCode
              properties:
                unitCode:
                  type: string
                  example: CAM-2026-001
                  maxLength: 40
                  minLength: 1
                  description: 修剪首尾空白，同一物品内唯一；重复返回400 VALIDATION_ERROR
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemUnit'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无管理范围权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 状态冲突或幂等键内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
  /items/{itemId}/units/{unitId}:
    patch:
      summary: 维护实物状态（管理员）；不得覆盖未归还记录
      operationId: updateItemUnit
      parameters:
      - $ref: '#/components/parameters/ItemId'
      - name: unitId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/UnitStatus'
      responses:
        '200':
          description: 更新后的实物
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemUnit'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无管理范围权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: 已借出和待核验时返回409 INVALID_STATE，不能用管理维护接口直接恢复可借。
      security:
      - bearerAuth: []
  /reservations:
    get:
      summary: 管理端筛选预约（须按管理范围授权）
      operationId: listReservations
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING_APPROVAL
          - WAITLISTED
          - CONFIRMED
          - REJECTED
          - CANCELLED
          - EXPIRED
          - OVERRIDDEN
          - RETURN_SUBMITTED
          - RETURN_REJECTED
          - COMPLETED
      - name: resourceType
        in: query
        schema:
          type: string
          enum:
          - ITEM
          - ROOM
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 预约列表；status=RETURN_SUBMITTED 时为归还核验队列
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReturnSubmission'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 状态冲突或幂等键内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: 本模块只处理status=RETURN_SUBMITTED；需要ReservationReturnGateway提供真实预约和归还绑定。未接入时返回503，其他预约查询由预约模块实现。
      security:
      - bearerAuth: []
  /reservations/{reservationId}/return-verification:
    post:
      summary: 管理员核验归还；接受后实物重新可借，驳回须写原因
      operationId: submitReturnVerification
      parameters:
      - name: reservationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          maxLength: 200
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnVerificationInput'
      responses:
        '200':
          description: 核验结果
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                properties:
                  id:
                    type: integer
                    format: int64
                  status:
                    type: string
                    enum:
                    - COMPLETED
                    - RETURN_REJECTED
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无管理范围权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: 使用同一数据库事务锁定预约和物品，记录核验和审计；接受后恢复实物，驳回保持占用。真实预约适配器缺失时返回503 DEPENDENCY_UNAVAILABLE。
      security:
      - bearerAuth: []
  /auth/login:
    post:
      summary: 管理员账号密码登录，返回令牌与本人资料
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /users:
    get:
      summary: 用户列表；管理端可按单个角色筛选
      operationId: listUsers
      parameters:
      - name: role
        in: query
        schema:
          $ref: '#/components/schemas/UserRole'
        description: 用户可同时具有多个角色，命中该角色即返回
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/me:
    get:
      summary: 当前登录人资料
      operationId: getMyProfile
      responses:
        '200':
          description: 本人资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      summary: 修改本人资料（姓名、邮箱、手机号；账号与角色不可改）
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateInput'
      responses:
        '200':
          description: 更新后的资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /users/me/password:
    post:
      summary: 修改本人密码；成功后旧会话失效，需重新登录
      operationId: changeMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeInput'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                type: object
                required:
                - changed
                properties:
                  changed:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
components:
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      - details
      - requestId
      properties:
        code:
          type: string
          example: DATABASE_UNAVAILABLE
        message:
          type: string
          example: 数据库暂时不可用
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
          description: 便于在服务端日志中定位本次请求
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          example: UP
    Location:
      type: object
      required:
      - id
      - name
      - type
      - status
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: 办公室 A
        type:
          type: string
          enum:
          - OFFICE
          - STORAGE
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    ItemRules:
      type: object
      description: 输入中提供的规则必须为整数，maxBorrowDays>=1，advanceDays>=0；省略时无默认业务值。
      properties:
        maxBorrowDays:
          type: integer
          minimum: 1
          example: 7
          description: 单次最长借用天数
          maximum: 2147483647
        advanceDays:
          type: integer
          minimum: 0
          example: 14
          description: 可提前预约天数
          maximum: 2147483647
    ItemInput:
      type: object
      required:
      - name
      - locationId
      properties:
        name:
          type: string
          maxLength: 50
          example: 佳能相机 EOS R50
        locationId:
          type: integer
          format: int64
          example: 2
          minimum: 1
        description:
          type: string
          maxLength: 300
          example: 含 18-45mm 套头、两块电池与相机包。
        isValuable:
          type: boolean
          default: false
          description: 贵重物品的预约必须经审核员审批
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          default: ACTIVE
        rules:
          $ref: '#/components/schemas/ItemRules'
      additionalProperties: false
    UnitSummary:
      type: object
      required:
      - total
      - available
      properties:
        total:
          type: integer
          example: 2
          minimum: 0
        available:
          type: integer
          example: 1
          minimum: 0
      description: 后端计算的当前实物摘要，available只计AVAILABLE；不代表预约时段可用量。
    Item:
      type: object
      required:
      - name
      - locationId
      - description
      - isValuable
      - status
      - rules
      - id
      - createdAt
      - unitSummary
      - images
      properties:
        name:
          type: string
          maxLength: 50
          example: 佳能相机 EOS R50
        locationId:
          type: integer
          format: int64
          example: 2
          minimum: 1
        description:
          type: string
          maxLength: 300
          example: 含 18-45mm 套头、两块电池与相机包。
        isValuable:
          type: boolean
          default: false
          description: 贵重物品的预约必须经审核员审批
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          default: ACTIVE
        rules:
          $ref: '#/components/schemas/ItemRulesResponse'
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        unitSummary:
          $ref: '#/components/schemas/UnitSummary'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ItemImage'
    ItemImage:
      type: object
      required:
      - id
      - itemId
      - fileName
      - url
      properties:
        id:
          type: integer
          format: int64
          example: 1
        itemId:
          type: integer
          format: int64
          example: 1
        fileName:
          type: string
          example: 机身正面.jpg
        url:
          type: string
          description: 需登录的相对地址，不含内部存储键
    UnitStatus:
      type: string
      enum:
      - AVAILABLE
      - MAINTENANCE
      - DISABLED
      - LOST
      description: 可借 / 维修中 / 停用 / 遗失
    ItemUnit:
      type: object
      required:
      - id
      - itemId
      - unitCode
      - status
      properties:
        id:
          type: integer
          format: int64
          example: 1
        itemId:
          type: integer
          format: int64
          example: 1
        unitCode:
          type: string
          example: CAM-2026-001
          maxLength: 40
          minLength: 1
          description: 修剪首尾空白，同一物品内唯一；重复返回400 VALIDATION_ERROR
        status:
          $ref: '#/components/schemas/UnitState'
    ReturnPhoto:
      type: object
      required:
      - id
      - fileName
      properties:
        id:
          type: integer
          format: int64
        fileName:
          type: string
          example: 机身正面.jpg
        url:
          type: string
          description: 受权限控制的图片地址，联调阶段由后端提供
    ReturnSubmission:
      type: object
      description: 归还核验队列条目（status=RETURN_SUBMITTED 的预约视图）
      required:
      - id
      - itemId
      - itemName
      - unitCode
      - borrower
      - submittedAt
      - photos
      - status
      properties:
        id:
          type: integer
          format: int64
          example: 501
        itemId:
          type: integer
          format: int64
          example: 1
        itemName:
          type: string
          example: 佳能相机 EOS R50
        unitCode:
          type: string
          example: CAM-2026-001
        borrower:
          type: string
          example: 王同学
        submittedAt:
          type: string
          format: date-time
        remark:
          type: string
          example: 镜头盖有一道划痕。
        photos:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReturnPhoto'
        status:
          type: string
          enum:
          - RETURN_SUBMITTED
    ReturnVerificationInput:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - ACCEPT
          - REJECT
        reason:
          type: string
          maxLength: 200
          description: 驳回（REJECT）时必填；接受后可备注
    LoginInput:
      type: object
      required:
      - account
      - password
      properties:
        account:
          type: string
          maxLength: 50
        password:
          type: string
          format: password
          maxLength: 100
    LoginResult:
      type: object
      required:
      - token
      - user
      properties:
        token:
          type: string
          description: 会话令牌；后续请求通过 Authorization Bearer 携带
        user:
          $ref: '#/components/schemas/AdminProfile'
    AdminProfile:
      type: object
      description: 角色与授权字段以 1 号（身份与权限接口）最终实现为准；业务审批须遵守禁止自审规则
      required:
      - id
      - account
      - name
      - roles
      properties:
        id:
          type: integer
          format: int64
        account:
          type: string
          example: admin
        name:
          type: string
          example: 陈老师
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
          description: 一名用户可同时具有多种角色（如资源管理员兼任审核员）
        resourceScopes:
          type: array
          items:
            type: integer
            format: int64
          description: 授权可管理的地点 id 集合（按资源记录授权，不按姓名写代码）
        department:
          type: string
          example: 学院办公室
        email:
          type: string
          format: email
        phone:
          type: string
        joinedAt:
          type: string
          format: date
        lastLoginAt:
          type: string
          format: date-time
    ProfileUpdateInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 100
        phone:
          type: string
          maxLength: 20
    PasswordChangeInput:
      type: object
      required:
      - oldPassword
      - newPassword
      properties:
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          description: 至少 8 位，需同时包含字母和数字
    ItemPage:
      type: object
      required:
      - content
      - page
      - size
      - totalElements
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
    ItemPatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
          example: 佳能相机 EOS R50
        locationId:
          type: integer
          format: int64
          example: 2
        description:
          type: string
          maxLength: 300
          example: 含 18-45mm 套头、两块电池与相机包。
        isValuable:
          type: boolean
          default: false
          description: 贵重物品的预约必须经审核员审批
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          default: ACTIVE
        rules:
          $ref: '#/components/schemas/ItemRules'
      additionalProperties: false
    ItemRulesResponse:
      type: object
      description: null表示未配置，不能理解为无限制。旧的非整天小时规则保留在数据库，需显式复核配置。
      properties:
        maxBorrowDays:
          type: integer
          minimum: 1
          example: 7
          description: 单次最长借用天数
          maximum: 2147483647
          nullable: true
        advanceDays:
          type: integer
          minimum: 0
          example: 14
          description: 可提前预约天数
          maximum: 2147483647
          nullable: true
    UnitState:
      type: string
      enum:
      - AVAILABLE
      - MAINTENANCE
      - DISABLED
      - LOST
      - CHECKED_OUT
      - RETURN_SUBMITTED
      description: 前四项可由管理员维护；已借出和待核验仅由交接业务更新。
    UserRole:
      type: string
      description: 开发约束 2.2 定义的五种角色；管理权限与审核权限分开
      enum:
      - USER
      - COUNSELOR_ADMIN
      - RESOURCE_MANAGER
      - REVIEWER
      - SYSTEM_ADMIN
  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    ValidationError:
      description: 参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: VALIDATION_ERROR
            message: 物品名称不能为空
            details:
              name: 必填
            requestId: 3f2b8f0e
    Unauthenticated:
      description: 未登录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: UNAUTHENTICATED
            message: 请先登录
            details: {}
            requestId: 3f2b8f0e
    Forbidden:
      description: 无权限或超出授权范围
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: FORBIDDEN
            message: 没有该资源的管理权限
            details: {}
            requestId: 3f2b8f0e
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: NOT_FOUND
            message: 资源不存在
            details: {}
            requestId: 3f2b8f0e
    InvalidState:
      description: 状态不允许该操作（如实物流转中、已处理的核验）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INVALID_STATE
            message: 实物尚未归还，不能变更状态
            details: {}
            requestId: 3f2b8f0e
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 认证模块必须校验令牌并建立 Servlet Principal/角色；目录模块不解析或信任客户端角色头。
