openapi: 3.0.3
info:
  title: 学院共用资源预约与借还系统 API
  version: 0.2.0
  description: |
    当前已实现账号登录与权限、物品目录、实物和展示照片接口。
    登录与写操作使用服务端会话；浏览器先 GET /auth/csrf，再提交令牌。
    普通物品预约、贵重物品与地点审核、物品领取归还及归还核验已实现。
    本契约须与实际代码同步，未实现的接口不得标为可用。
servers:
- url: http://localhost:8080/api/v1
  description: 本地开发；部署后通过环境配置替换地址
paths:
  /announcements:
    get:
      summary: 获取已发布公告，管理人员可查看全部
      parameters:
      - { name: managed, in: query, schema: { type: boolean, default: false } }
      - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 公告分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementPage' }
        '403': { description: 管理列表需要管理权限 }
    post:
      summary: 发布公告（系统管理员或审核员）
      security: [ { sessionCookie: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '201': { description: 发布成功 }
        '400': { description: 标题或内容无效 }
        '403': { description: 无管理权限 }
  /announcements/{id}:
    put:
      summary: 修改、撤下或重新发布公告
      security: [ { sessionCookie: [] } ]
      parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '200': { description: 修改成功 }
        '400': { description: 内容或状态无效 }
        '403': { description: 无管理权限 }
        '404': { description: 公告不存在 }
  /feedback:
    get:
      summary: 查看本人的反馈；管理人员可查看全部
      security: [ { sessionCookie: [] } ]
      parameters:
      - { name: managed, in: query, schema: { type: boolean, default: false } }
      - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 反馈分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackPage' }
        '403': { description: 无管理权限 }
    post:
      summary: 登录用户提交反馈
      security: [ { sessionCookie: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201': { description: 反馈已提交 }
        '400': { description: 内容无效 }
        '401': { description: 未登录 }
  /feedback/{id}:
    put:
      summary: 更新反馈状态和回复
      security: [ { sessionCookie: [] } ]
      parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }
                response: { type: string, maxLength: 2000, description: 标记为已处理时必填 }
      responses:
        '200': { description: 处理结果已保存 }
        '400': { description: 状态或回复无效 }
        '403': { description: 无管理权限 }
        '404': { description: 反馈不存在 }
  /auth/csrf:
    get:
      summary: 获取会话 CSRF 令牌
      operationId: getCsrf
      responses:
        '200':
          description: 返回 token 和需要提交的请求头名称
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /auth/login:
    post:
      summary: 登录（需 CSRF 令牌）
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功；服务端建立会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 1
                loginName: demo.admin
                displayName: 初始系统管理员
                status: ACTIVE
                grants:
                  - role: SYSTEM_ADMIN
                    locationId: null
                reviewer: false
        '401':
          description: 账号或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INVALID_CREDENTIALS
                message: 账号或密码错误
                details: {}
                requestId: 00000000-0000-0000-0000-000000000000
  /auth/me:
    get:
      summary: 查询当前登录用户和最新授权
      operationId: currentUser
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 1
                loginName: demo.admin
                displayName: 初始系统管理员
                status: ACTIVE
                grants:
                  - role: SYSTEM_ADMIN
                    locationId: null
                reviewer: false
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/logout:
    post:
      summary: 退出登录（需 CSRF 令牌）
      operationId: logout
      responses:
        '204':
          description: 会话已失效
  /users:
    get:
      summary: 系统管理员查看账号
      operationId: listUsers
      responses:
        '200':
          description: 账号列表；不返回密码哈希
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProfile'
        '403':
          description: 无系统管理权限
    post:
      summary: 系统管理员建立账号（需 CSRF 令牌）
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: 账号已建立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '409':
          description: 账号已存在
  /users/{id}:
    delete:
      summary: 停用其他账号并保留历史记录
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      responses:
        '204': { description: 账号已停用 }
        '403': { description: 仅系统管理员可操作 }
        '409': { description: 不能停用自己或目标有未完成预约 }
  /users/me/password:
    post:
      summary: 修改当前账号密码
      description: 验证原密码后更新密码并注销当前会话；新密码至少 12 位，UTF-8 编码不超过 72 字节。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 12
      responses:
        '204':
          description: 密码修改成功，当前会话已注销
        '400':
          description: 原密码错误或新密码不符合要求
        '409':
          description: 密码已被其他请求更改
  /users/{id}/grants:
    put:
      summary: 系统管理员替换某账号授权和审核小组身份（需 CSRF 令牌；不得修改自己）
      operationId: replaceGrants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantUpdate'
      responses:
        '200':
          description: 最新授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '409':
          description: 禁止修改自己的授权
  /audit-logs:
    get:
      summary: 系统管理员读取最近审计记录
      operationId: listAuditLogs
      parameters:
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 最近审计记录
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /health:
    get:
      summary: 后端进程健康检查
      operationId: getHealth
      responses:
        '200':
          description: 服务已启动
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /locations:
    get:
      summary: 获取初始存放地点
      operationId: listLocations
      responses:
        '200':
          description: 地点列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /items:
    get:
      summary: 物品列表（管理端/浏览）
      operationId: listItems
      parameters:
      - name: locationId
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: keyword
        in: query
        description: 名称或介绍包含匹配；%和_按字面匹配
        schema:
          type: string
          maxLength: 100
          default: ''
      - name: status
        in: query
        description: 公开目录仅支持ACTIVE；INACTIVE需scope=managed并授权
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - public
          - managed
          default: public
      - name: onlyAvailable
        in: query
        description: 当前至少有一件AVAILABLE实物，不代表预约时段可用量
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 物品及服务端库存摘要
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/Item'
                - $ref: '#/components/schemas/ItemPage'
          headers:
            X-Total-Count:
              schema:
                type: integer
                format: int64
              description: 筛选后的总数量
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无管理范围权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 状态冲突或幂等键内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: '未传page和size时保留PR #2的数组格式（默认最多20条）；显式传任一分页参数时返回分页对象。X-Total-Count始终返回总数。scope=managed仅返回本人可管理地点的物品。'
    post:
      summary: 上架物品（管理员）
      operationId: createItem
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          maxLength: 200
        description: 防重复提交
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 状态冲突或幂等键内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - sessionCookie: []
  /locations/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    patch:
      summary: 修改办公室或物资室信息（管理员或审核员）
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string, maxLength: 100 }
                type: { type: string, enum: [OFFICE, STORAGE] }
      responses:
        '200': { description: 更新成功 }
        '400': { description: 地点信息无效 }
        '403': { description: 无权限 }
        '404': { description: 地点不存在 }
        '409': { description: 地点名称重复 }
    delete:
      summary: 移除办公室或物资室（保留历史记录）
      description: 地点仍有物品或未完成预约、借还时拒绝移除。
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: 移除成功 }
        '403': { description: 无权限 }
        '404': { description: 地点不存在 }
        '409': { description: 仍有物品或未完成借还 }
  /departments:
    get:
      summary: 获取可选部门列表
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: 部门列表 }
        '401': { description: 未登录 }
    post:
      summary: 新增部门选项（系统管理员）
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        '201': { description: 部门已新增 }
        '403': { description: 无权限 }
        '409': { description: 部门名称已存在 }
  /users/me/details:
    get:
      summary: 读取当前账号的个人资料
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: 返回部门、邮箱、手机号及头像状态 }
        '401': { description: 未登录 }
    patch:
      summary: 修改当前账号的部门、邮箱和手机号
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                department: { type: string, maxLength: 100 }
                email: { type: string, maxLength: 254 }
                phone: { type: string, maxLength: 30 }
      responses:
        '200': { description: 个人资料已保存 }
        '400': { description: 输入格式无效 }
        '401': { description: 未登录 }
  /users/me/avatar:
    post:
      summary: 上传当前账号头像
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '204': { description: 上传成功（JPG 或 PNG，最大 2 MB） }
        '400': { description: 图片无效 }
  /users/{id}/avatar:
    get:
      summary: 读取用户头像（仅登录用户）
      security: [{ sessionCookie: [] }]
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      responses:
        '200': { description: 头像图片 }
        '404': { description: 头像不存在 }
  /locations/{id}/image:
    get:
      summary: 查看存放地点照片
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      responses:
        '200': { description: 地点图片 }
        '404': { description: 地点或图片不存在 }
    post:
      summary: 上传或替换办公室与物资室照片
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '204': { description: 图片已更新 }
        '403': { description: 无管理权限 }
  /items/{itemId}:
    delete:
      summary: 移除物品（保留历史记录）
      description: 有待审核预约、未结束预约或未完成借还时不可移除；移除后不再出现在物品列表。
      operationId: archiveItem
      parameters:
      - $ref: '#/components/parameters/ItemId'
      security:
      - sessionCookie: []
      responses:
        '204':
          description: 移除成功
        '403':
          description: 无管理范围权限
        '409':
          description: 物品仍有未处理预约或借还
    patch:
      summary: 编辑物品（管理员）
      operationId: updateItem
      parameters:
      - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPatch'
      responses:
        '200':
          description: 更新后的物品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无管理范围权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 状态冲突或幂等键内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: 部分更新，省略字段保持不变；rules按子字段合并。地点变更同时检查原地点和新地点授权。贵重标记不会修改既有预约快照，预约模块必须保留申请创建时的规则。
      security:
      - sessionCookie: []
    get:
      summary: 物品详情
      operationId: getItem
      parameters:
      - $ref: '#/components/parameters/ItemId'
      - name: managed
        in: query
        schema:
          type: boolean
          default: false
        description: true时校验管理范围并允许查看停用物品
      responses:
        '200':
          description: 含创建时间、库存、规则及受控图片地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: 不存在或未上架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无管理范围权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 状态冲突或幂等键内容冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /items/{itemId}/availability:
    get:
      summary: 公开查看物品单日逐小时库存（北京时间）
      operationId: itemAvailability
      parameters:
      - $ref: '#/components/parameters/ItemId'
      - name: date
        in: query
        required: true
        schema: { type: string, format: date }
      responses:
        '200':
          description: 返回24个小时的峰值占用、剩余库存及待审数量，不包含申请人信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  total: { type: integer, description: 当前可参与预约的实物数量 }
                  slots:
                    type: array
                    items:
                      type: object
                      properties:
                        hour: { type: integer, minimum: 0, maximum: 23 }
                        reserved: { type: integer }
