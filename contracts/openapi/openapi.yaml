openapi: 3.0.3
info:
  title: 学院共用资源预约与借还系统 API
  version: 0.1.0
  description: |
    本文件仅列出初始化骨架中计划立即联调的接口。
    完整业务接口见 docs/开发约束.md；新增接口须先更新本文件，再提交代码。
servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发；部署后通过环境配置替换地址
paths:
  /health:
    get:
      summary: 后端进程健康检查
      operationId: getHealth
      responses:
        '200':
          description: 服务已启动
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /locations:
    get:
      summary: 获取初始存放地点
      operationId: listLocations
      responses:
        '200':
          description: 地点列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      required: [code, message, details, requestId]
      properties:
        code:
          type: string
          example: DATABASE_UNAVAILABLE
        message:
          type: string
          example: 数据库暂时不可用
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
          description: 便于在服务端日志中定位本次请求
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
    Location:
      type: object
      required: [id, name, type, status]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: 办公室 A
        type:
          type: string
          enum: [OFFICE, STORAGE]
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
