      description: 当前实现只处理 handoverStatus=RETURN_SUBMITTED，并按管理员地点范围过滤。
      security:
      - sessionCookie: []
  /reservations/{reservationId}/pickup:
    post:
      summary: 申请人确认领取并绑定具体实物编号
      operationId: pickupReservation
      security:
      - sessionCookie: []
      parameters:
      - name: reservationId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitCodes]
              properties:
                unitCodes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: 领取成功；同键同内容重试不会重复绑定实物
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
  /reservations/{reservationId}/return-submission:
    post:
      summary: 申请人上传照片和备注并提交归还
      operationId: submitItemReturn
      security:
      - sessionCookie: []
      parameters:
      - name: reservationId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items: { type: string, format: binary }
                remark: { type: string, maxLength: 300 }
      responses:
        '200':
          description: 归还材料已进入待核验队列；同键同内容重试不会重复创建提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '413': { description: 文件超过大小限制 }
  /return-photos/{photoId}:
    get:
      summary: 申请人或有地点权限的管理员读取归还照片
      operationId: readReturnPhoto
      security:
      - sessionCookie: []
      parameters:
      - name: photoId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      responses:
        '200':
          description: JPG、PNG或WebP图片
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reservations/{reservationId}/return-verification:
    post:
      summary: 管理员核验归还；接受后实物重新可借，驳回须写原因
      operationId: submitReturnVerification
      parameters:
      - name: reservationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          maxLength: 200
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnVerificationInput'
      responses:
        '200':
          description: 核验结果
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - handoverStatus
                properties:
                  id:
                    type: integer
                    format: int64
                  handoverStatus:
                    type: string
                    enum:
                    - COMPLETED
                    - RETURN_REJECTED
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 无管理范围权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 数据库不可用或依赖尚未接入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: 使用同一数据库事务锁定预约和物品，记录核验和审计；接受后恢复实物，驳回保持占用。真实预约适配器缺失时返回503 DEPENDENCY_UNAVAILABLE。
      security:
      - sessionCookie: []
components:
  schemas:
    AnnouncementInput:
      type: object
      required: [title, content]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        content: { type: string, minLength: 1, maxLength: 5000 }
        status: { type: string, enum: [PUBLISHED, WITHDRAWN], description: 修改时可指定；创建时固定为 PUBLISHED }
    Announcement:
      allOf:
      - { $ref: '#/components/schemas/AnnouncementInput' }
      - type: object
        properties:
          id: { type: integer, format: int64 }
          authorName: { type: string }
          editorName: { type: string }
          createdAt: { type: string, format: date-time }
          updatedAt: { type: string, format: date-time }
    AnnouncementPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/Announcement' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    FeedbackEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        userName: { type: string }
        content: { type: string }
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }
        response: { type: string }
        handlerName: { type: string, nullable: true }
        handledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FeedbackPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/FeedbackEntry' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    Space:
      type: object
      required: [id, name, description, capacity, status]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        capacity: { type: integer, minimum: 1 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        imageUrl: { type: string, nullable: true }
    SpaceInput:
      type: object
      required: [name, capacity]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        capacity: { type: integer, minimum: 1, maximum: 1000 }
    SpaceSlot:
      type: object
      required: [hour, status]
      properties:
        hour: { type: integer, minimum: 8, maximum: 21 }
        status: { type: string, enum: [CONFIRMED, PENDING_APPROVAL] }
    ApprovalQueueEntry:
      type: object
      required: [reservationId, resourceType, resourceId, startAt, endAt, purpose, submittedAt]
      properties:
        reservationId: { type: integer, format: int64 }
        resourceType: { type: string, enum: [ITEM, SPACE] }
        resourceId: { type: integer, format: int64 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        purpose: { type: string }
        submittedAt: { type: string, format: date-time }
    CreateItemReservation:
      type: object
      required: [resourceType, resourceId, startAt, endAt, purpose]
      properties:
        resourceType:
          type: string
          enum: [ITEM, SPACE]
        resourceId:
          type: integer
          format: int64
        startAt:
          type: string
          format: date-time
          description: 带时区的 ISO 8601 整点时间；时段采用 [startAt,endAt)。物品可跨天，地点限同一天。
        endAt:
          type: string
          format: date-time
        purpose:
          type: string
          maxLength: 300
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
    ItemReservation:
      type: object
      required: [id, resourceType, resourceId, applicantId, itemName, startAt, endAt,
        purpose, quantity, status, submissionSeq, submittedAt]
      properties:
        id: { type: integer, format: int64 }
        resourceType: { type: string, enum: [ITEM, SPACE] }
        resourceId: { type: integer, format: int64 }
        applicantId: { type: integer, format: int64 }
        itemName: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        purpose: { type: string }
        quantity: { type: integer }
        status: { type: string, enum: [CONFIRMED, PENDING_APPROVAL, REJECTED, CANCELLED, EXPIRED] }
        handoverStatus:
          type: string
          nullable: true
          enum: [NOT_PICKED_UP, CHECKED_OUT, RETURN_SUBMITTED, RETURN_REJECTED, COMPLETED]
        lastReturnReason:
          type: string
          nullable: true
          maxLength: 200
        submissionSeq: { type: integer, format: int64 }
        submittedAt: { type: string, format: date-time }
    ItemReservationPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ItemReservation'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    PendingReservation:
      type: object
      required: [id, resourceType, resourceId, itemName, applicantId, applicantName, startAt,
        endAt, purpose, quantity, status, submissionSeq, submittedAt, priorityTier, competingPending]
      properties:
        id: { type: integer, format: int64 }
        resourceType: { type: string, enum: [ITEM, SPACE] }
        resourceId: { type: integer, format: int64 }
        itemName: { type: string }
        applicantId: { type: integer, format: int64 }
        applicantName: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        purpose: { type: string }
        quantity: { type: integer }
        status: { type: string, enum: [PENDING_APPROVAL] }
        submissionSeq: { type: integer, format: int64 }
        submittedAt: { type: string, format: date-time }
        priorityTier:
          type: string
          enum: [STANDARD]
          description: 当前申请不再区分辅导员优先级
        competingPending:
          type: integer
          minimum: 0
          description: 同一资源同一时段其他待审申请数量，用于提示批准后其余申请将被占用
    PendingReservationPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PendingReservation'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    ReservationLog:
      type: object
      required: [id, resourceType, resourceId, resourceName, applicantId, applicantName,
        loginName, startAt, endAt, submittedAt, purpose, quantity, status]
      properties:
        id: { type: integer, format: int64 }
        resourceType: { type: string, enum: [ITEM, SPACE] }
        resourceId: { type: integer, format: int64 }
        resourceName: { type: string }
        applicantId: { type: integer, format: int64 }
        applicantName: { type: string }
        loginName: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time }
        purpose: { type: string }
        quantity: { type: integer }
        status: { type: string, enum: [CONFIRMED, PENDING_APPROVAL, REJECTED, CANCELLED, EXPIRED] }
        reviewerName:
          type: string
          nullable: true
          description: 审核人姓名；系统自动确认时为 null
        decision:
          type: string
          nullable: true
          enum: [APPROVED, REJECTED, AUTO_CONFIRMED]
        decisionReason:
          type: string
          nullable: true
          description: 拒绝原因；同意时可为空
        reviewedAt:
          type: string
          format: date-time
          nullable: true
    ReservationLogPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReservationLog'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    CsrfToken:
      type: object
      required: [token, headerName]
      properties:
        token:
          type: string
        headerName:
          type: string
          example: X-CSRF-TOKEN
    LoginRequest:
      type: object
      required: [loginName, password]
      properties:
        loginName:
          type: string
          example: demo.admin
        password:
          type: string
          format: password
    NewUser:
      type: object
      required: [loginName, displayName, password]
      properties:
        loginName:
          type: string
          example: student01
        displayName:
          type: string
          example: 测试用户
        password:
          type: string
          format: password
          minLength: 12
    Grant:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [COUNSELOR_ADMIN, RESOURCE_MANAGER, SYSTEM_ADMIN]
          description: 旧角色仅用于兼容历史响应，权限更新仅允许 SYSTEM_ADMIN
        locationId:
          type: integer
          format: int64
          nullable: true
          description: RESOURCE_MANAGER 必填，其他角色不得填写
    GrantUpdate:
      type: object
      required: [grants, reviewer]
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        reviewer:
          type: boolean
          description: 是否为审核员；系统管理员无需同时设置审核员
    UserProfile:
      type: object
      required: [id, loginName, displayName, status, grants, reviewer]
      properties:
        id:
          type: integer
          format: int64
        loginName:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        reviewer:
          type: boolean
    ApiError:
      type: object
      required:
      - code
      - message
      - details
      - requestId
      properties:
        code:
          type: string
          example: DATABASE_UNAVAILABLE
        message:
          type: string
          example: 数据库暂时不可用
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
          description: 便于在服务端日志中定位本次请求
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          example: UP
    Location:
      type: object
      required:
      - id
      - name
      - type
      - status
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: 办公室 A
        type:
          type: string
          enum:
          - OFFICE
          - STORAGE
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    ItemRules:
      type: object
      description: 输入中提供的规则必须为整数，maxBorrowDays>=1，advanceDays>=0；省略时无默认业务值。
      properties:
        maxBorrowDays:
          type: integer
          minimum: 1
          example: 7
          description: 单次最长借用天数
          maximum: 2147483647
        advanceDays:
          type: integer
          minimum: 0
          example: 14
          description: 可提前预约天数
          maximum: 2147483647
    ItemInput:
      type: object
      required:
      - name
      - locationId
      properties:
        name:
          type: string
          maxLength: 50
          example: 佳能相机 EOS R50
        locationId:
          type: integer
          format: int64
          example: 2
          minimum: 1
        initialStock:
          type: integer
          minimum: 0
          maximum: 500
          default: 0
          description: 创建物品时一并生成的实物数量；编号由服务端自动分配
        description:
          type: string
          maxLength: 300
          example: 含 18-45mm 套头、两块电池与相机包。
        isValuable:
          type: boolean
          default: false
          description: 贵重物品的预约必须经审核员审批
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          default: ACTIVE
        rules:
          $ref: '#/components/schemas/ItemRules'
      additionalProperties: false
    UnitSummary:
      type: object
      required:
      - total
      - available
      properties:
        total:
          type: integer
          example: 2
          minimum: 0
        available:
          type: integer
          example: 1
          minimum: 0
      description: 后端计算的当前实物摘要，available只计AVAILABLE；不代表预约时段可用量。
    Item:
      type: object
      required:
      - name
      - locationId
      - description
      - isValuable
      - status
      - rules
      - id
      - createdAt
      - unitSummary
      - images
      properties:
        name:
          type: string
          maxLength: 50
          example: 佳能相机 EOS R50
        locationId:
          type: integer
          format: int64
          example: 2
          minimum: 1
        description:
          type: string
          maxLength: 300
          example: 含 18-45mm 套头、两块电池与相机包。
        isValuable:
          type: boolean
          default: false
          description: 贵重物品的预约必须经审核员审批
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          default: ACTIVE
        rules:
          $ref: '#/components/schemas/ItemRulesResponse'
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        unitSummary:
          $ref: '#/components/schemas/UnitSummary'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ItemImage'
    ItemImage:
      type: object
      required:
      - id
      - itemId
      - fileName
      - url
      properties:
        id:
          type: integer
          format: int64
          example: 1
        itemId:
          type: integer
          format: int64
          example: 1
        fileName:
          type: string
          example: 机身正面.jpg
        url:
          type: string
          description: 公开上架物品可匿名读取的相对地址；停用物品需管理权限；不含内部存储键
    UnitStatus:
      type: string
      enum:
      - AVAILABLE
      - MAINTENANCE
      - DISABLED
      - LOST
      description: 可借 / 维修中 / 停用 / 遗失
    ItemUnit:
      type: object
      required:
      - id
      - itemId
      - unitCode
      - status
      properties:
        id:
          type: integer
          format: int64
          example: 1
        itemId:
          type: integer
          format: int64
          example: 1
        unitCode:
          type: string
          example: CAM-2026-001
          maxLength: 40
          minLength: 1
          description: 修剪首尾空白，同一物品内唯一；重复返回400 VALIDATION_ERROR
        status:
          $ref: '#/components/schemas/UnitState'
    ReturnPhoto:
      type: object
      required:
      - id
      - fileName
      properties:
        id:
          type: integer
          format: int64
        fileName:
          type: string
          example: 机身正面.jpg
        url:
          type: string
          description: 受权限控制的图片地址，联调阶段由后端提供
    ReturnSubmission:
      type: object
      description: 归还核验队列条目（handoverStatus=RETURN_SUBMITTED 的预约视图）
      required:
      - id
      - itemId
      - itemName
      - unitCodes
      - borrower
      - submittedAt
      - photos
      - handoverStatus
      properties:
        id:
          type: integer
          format: int64
          example: 501
        itemId:
          type: integer
          format: int64
          example: 1
        itemName:
          type: string
          example: 佳能相机 EOS R50
        unitCodes:
          type: array
          minItems: 1
          items: { type: string }
          example: [CAM-2026-001]
        borrower:
          type: string
          example: 王同学
        submittedAt:
          type: string
          format: date-time
        remark:
          type: string
          example: 镜头盖有一道划痕。
        photos:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReturnPhoto'
        handoverStatus:
          $ref: '#/components/schemas/HandoverStatus'
    HandoverResult:
      type: object
      required: [id, handoverStatus, unitCodes, photoCount]
      properties:
        id: { type: integer, format: int64 }
        handoverStatus: { $ref: '#/components/schemas/HandoverStatus' }
        unitCodes:
          type: array
          items: { type: string }
        photoCount: { type: integer, minimum: 0 }
        lastReturnReason:
          type: string
          nullable: true
          maxLength: 200
    ReturnVerificationInput:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - ACCEPT
          - REJECT
        reason:
          type: string
          maxLength: 200
          description: 驳回（REJECT）时必填；接受后可备注
    ItemPage:
      type: object
      required:
      - content
      - page
      - size
      - totalElements
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
    ItemPatch:
      type: object
      properties:
        stockQuantity:
          type: integer
          minimum: 0
          maximum: 500
          description: 与物品属性在同一事务中保存；新增实物自动编号，减少库存须无占用预约且仅移除可用实物。
        name:
          type: string
          maxLength: 50
          example: 佳能相机 EOS R50
        locationId:
          type: integer
          format: int64
          example: 2
        description:
          type: string
          maxLength: 300
          example: 含 18-45mm 套头、两块电池与相机包。
        isValuable:
          type: boolean
          default: false
          description: 贵重物品的预约必须经审核员审批
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          default: ACTIVE
        rules:
          $ref: '#/components/schemas/ItemRules'
      additionalProperties: false
    ItemRulesResponse:
      type: object
      description: null表示未配置，不能理解为无限制。旧的非整天小时规则保留在数据库，需显式复核配置。
      properties:
        maxBorrowDays:
          type: integer
          minimum: 1
          example: 7
          description: 单次最长借用天数
          maximum: 2147483647
          nullable: true
        advanceDays:
          type: integer
          minimum: 0
          example: 14
          description: 可提前预约天数
          maximum: 2147483647
          nullable: true
    UnitState:
      type: string
      enum:
      - AVAILABLE
      - MAINTENANCE
      - DISABLED
      - LOST
      - CHECKED_OUT
      - RETURN_SUBMITTED
      description: 前四项可由管理员维护；已借出和待核验仅由交接业务更新。
    HandoverStatus:
      type: string
      enum:
      - NOT_PICKED_UP
      - CHECKED_OUT
      - RETURN_SUBMITTED
      - RETURN_REJECTED
      - COMPLETED
      description: 物品领取和归还状态；与预约审批状态status相互独立。
    UserRole:
      type: string
      description: 用户界面展示的三种角色
      enum:
      - USER
      - REVIEWER
      - SYSTEM_ADMIN
  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    ValidationError:
      description: 参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: VALIDATION_ERROR
            message: 物品名称不能为空
            details:
              name: 必填
            requestId: 3f2b8f0e
    Unauthenticated:
      description: 未登录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: UNAUTHENTICATED
            message: 请先登录
            details: {}
            requestId: 3f2b8f0e
    Forbidden:
      description: 无权限或超出授权范围
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: FORBIDDEN
            message: 没有该资源的管理权限
            details: {}
            requestId: 3f2b8f0e
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: NOT_FOUND
            message: 资源不存在
            details: {}
            requestId: 3f2b8f0e
    InvalidState:
      description: 状态不允许该操作（如实物流转中、已处理的核验）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INVALID_STATE
            message: 实物尚未归还，不能变更状态
            details: {}
            requestId: 3f2b8f0e
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 服务端会话 Cookie；所有写请求还需先获取并提交 CSRF 令牌。
