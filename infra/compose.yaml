services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: college_booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - booking-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d college_booking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  booking-postgres-data:
