spring.application.name=college-booking-backend
# Local development reads the root .env file; deployments can provide environment variables.
spring.config.import=optional:file:../.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/college_booking}
spring.datasource.username=${DB_USERNAME:booking}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
