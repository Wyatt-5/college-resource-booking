spring.application.name=college-booking-backend
# Local development reads the root .env file; deployments can provide environment variables.
spring.config.import=optional:file:../.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/college_booking}
spring.datasource.username=${DB_USERNAME:booking}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
catalog.images.directory=${CATALOG_IMAGE_DIRECTORY:./data/catalog-images}
catalog.images.max-count=${CATALOG_IMAGE_MAX_COUNT:6}
catalog.images.max-bytes=5242880
